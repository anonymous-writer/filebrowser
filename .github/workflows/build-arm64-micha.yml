
name: Build ARM64

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build FileBrowser ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      # Immer den Branch bzw. Commit auschecken,
      # der diesen Workflow ausgelöst hat.
      - name: Checkout active branch
        uses: actions/checkout@v4

      - name: Show build version
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build ARM64 binary
        working-directory: backend
        run: |
          go build \
            -o filebrowser \
            --ldflags="-w -s -X github.com/gtsteffaniak/filebrowser/backend/internal/version.Version=${GITHUB_REF_NAME}"

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: filebrowser-${{ github.ref_name }}-linux-arm64
          path: backend/filebrowser

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Erzeugt automatisch einen gültigen Docker-Tag
      # aus dem Branch-Namen, auch bei Branches mit "/".
      - name: Generate Docker tags
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,suffix=-arm64
            type=raw,value=arm64

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./_docker/Dockerfile.slim
          platforms: linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
