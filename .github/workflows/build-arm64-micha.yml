
name: Build ARM64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build FileBrowser ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          repository: anonymous-writer/filebrowser
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Build frontend
        working-directory: frontend
        run: |
          npm i
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build ARM64 binary
        working-directory: backend
        run: |
          go build \
            -o filebrowser \
            --ldflags="-w -s -X github.com/gtsteffaniak/filebrowser/backend/internal/version.Version=main"

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: filebrowser-main-linux-arm64
          path: backend/filebrowser

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./_docker/Dockerfile.slim
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main-arm64
            ghcr.io/${{ github.repository }}:arm64
          build-args: |
            VERSION=main
            REVISION=${{ github.sha }}

