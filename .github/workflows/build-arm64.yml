name: Build ARM64

on:
  push:
    branches:
      - "v2.1.0-arm64"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build FileBrowser ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout FileBrowser dev/v2.1.0
        uses: actions/checkout@v4
        with:
          repository: gtsteffaniak/filebrowser
          ref: dev/v2.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./_docker/Dockerfile.slim
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v2.1.0-arm64
            ghcr.io/${{ github.repository }}:arm64
          build-args: |
            VERSION=v2.1.0
            REVISION=${{ github.sha }}
